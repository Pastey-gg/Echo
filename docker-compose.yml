services:
  db:
    image: postgres:18
    restart: unless-stopped
    shm_size: 256mb
    mem_limit: 1g
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c max_connections=50
    networks:
      - backend
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: echo
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql
    expose:
      - "5432"
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d echo"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    networks:
      - backend
    expose:
      - "6379"
    mem_limit: 384m
    command: >
      valkey-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    mem_limit: 384m
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
        required: false
      valkey:
        condition: service_healthy
        required: false
    # config.yaml is the single source of truth for all application settings.
    # Update general.port and database.dsn there; then mirror the port below.
    # When running via Docker the DSN host must be "db" (the service name above).
    # To run against a local Postgres instead, use: `go run .` or `go build` and run `./Echo`
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    ports:
      # Mirror the port set in config.yaml -> general.port
      - "8080:8080"

networks:
  backend:

volumes:
  postgres_data:
