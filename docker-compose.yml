services:
  db:
    image: postgres:18
    restart: unless-stopped
    networks:
      - backend
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: echo
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql
    ports:
      - "5469:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d echo"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - valkey_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
        required: false
      valkey:
        condition: service_healthy
        required: false
    # config.yaml is the single source of truth for all application settings.
    # Update general.port and database.dsn there; then mirror the port below.
    # When running via Docker the DSN host must be "db" (the service name above).
    # To run against a local Postgres instead, use: `go run .` or `go build` and run `./Echo`
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    ports:
      # Mirror the port set in config.yaml -> general.port
      - "8080:8080"

networks:
  backend:

volumes:
  postgres_data:
  valkey_data:
